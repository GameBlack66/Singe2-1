<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page avec Sidebar et Header</title>
    <style>
        /* Styles généraux */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: url("background.jpg");
        }

        /* --- HEADER EN HAUT --- */
        header {
            height: 125px;
            background-image: url("foretdessinges.jpg");
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #38bdf8;
        }

        .header-center {
            font-size: 18px;
            font-weight: 500;
        }

        /* --- CONTENEUR PRINCIPAL (Sidebar + Texte) --- */
        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* --- SIDEBAR À GAUCHE --- */
        sidebar {
            width: 250px;
      background: linear-gradient(to bottom, #000000, #ffffff);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            transition: transform 0.3s ease;
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 5;
        }

        sidebar.closed {
            transform: translateX(-100%);
        }

        sidebar button {
            background-color: #334155;
            color: white;
            border: none;
            padding: 12px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }

        sidebar button:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }

        /* --- ZONE DE TEXTE AU CENTRE --- */
        main {
            flex: 1;
            margin-left: 250px;
            padding: 40px;
            overflow-y: auto;
            transition: margin-left 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        main.full-width {
            margin-left: 0;
        }

        .content-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 600px;
        }
        .gold {
  background: linear-gradient(45deg, #462523, #cb9b51 22%, #f6e27a 45%, #f6f2c0 50%, #f6e27a 55%, #cb9b51 78%, #462523);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
    </style>
</head>
<body>

    <!-- Header en haut avec logo à gauche et texte au centre -->
    <header>
        <div class="header-left">
            <div id="mon-icone"><button class="toggle-btn" onclick="toggleSidebar()" style="background: black;">&#9776;</button></div>
            <div class="logo">
                <a href='index.html'><img src="wikimonkey.jpg" width='20%' style='border: 2px solid black; border-radius: 20px; '></a>
            </div>
        </div>
        <div class="header-center" style="background-color: black;">Wikimoney : des singes qui trient des singes ! </div>
        <div style="width: 50px;"></div> 
        
    </header>

    <!-- Corps principal -->
    <div class="main-container">
        <!-- Sidebar à gauche avec des boutons -->
        <sidebar id="mySidebar">
            <button onclick="buttonac()">Accueil</button>
            <button onclick="buttona()">Armand</button>
            <button onclick="buttonl()">Lukas</button>
            <button onclick="buttono()">Oulann</button>
            <button onclick="buttong()">Gael</button>
            <button onclick="buttonn()">Noel</button>
        </sidebar>

        <!-- Texte s'affichant au centre -->
        <main id="mainContent">
<p> Coucou le code marche super bien, pour information Lukas tu es contre ou pour les immigrés (pour /contre) (attente d'une reponse)</p>
            </div>
        </main>
    </div>
<h1>By </h1><p class='gold'>Wikimonkey</p>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('mySidebar');
            const main = document.getElementById('mainContent');
            sidebar.classList.toggle('closed');
            main.classList.toggle('full-width');
        }

function buttona() {
    window.location.href = "armand.html";
}
function buttonl() {
    window.location.href= "lukas.html";
}
        function buttono() {
            window.location.href='oulann.html';
        }
        function buttong() {
            window.location.href='gael.html';
        }
        function buttonac() {
            window.location.href='index.html';
        }
        function buttonn() {
            window.location.href='noel.html';
        }
const icone = document.getElementById("mon-icone");

icone.addEventListener("mouseover", () => {
  icone.animate(
    [
      { transform: "translate(0, 0)" },
      { transform: "translate(5px, -5px)" },
      { transform: "translate(0, 0)" }
    ],
    {
      duration: 1000, 
      iterations: 1       }
  );
});

    </script>

</body>
</html>
