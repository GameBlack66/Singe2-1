<style>
    /* 3D Extrusion Styles & Arcade Physics */
    .btn-3d-yellow {
      background: linear-gradient(180deg, #FFD000 0%, #F5B800 100%);
      box-shadow: 0 5px 0 #B87B00, 0 8px 12px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.6);
      transition: all 0.08s ease;
    }
    .btn-3d-yellow:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #B87B00, 0 3px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .btn-3d-green {
      background: linear-gradient(180deg, #10a65a 0%, #038043 100%);
      box-shadow: 0 5px 0 #024F29, 0 8px 12px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.4);
      transition: all 0.08s ease;
    }
    .btn-3d-green:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #024F29, 0 3px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .btn-3d-orange {
      background: linear-gradient(180deg, #FF7A00 0%, #E05C00 100%);
      box-shadow: 0 5px 0 #8F3700, 0 8px 12px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.4);
      transition: all 0.08s ease;
    }
    .btn-3d-orange:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #8F3700, 0 3px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .btn-3d-wood {
      background: linear-gradient(180deg, #4c2d1f 0%, #33180c 100%);
      box-shadow: 0 4px 0 #1e0801, 0 6px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .btn-3d-wood:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1e0801, 0 2px 4px rgba(0,0,0,0.4);
    }

    /* Floating Jump & Idle Animations */
    @keyframes monkey-float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .animate-float {
      animation: monkey-float 1.6s ease-in-out infinite;
    }

    @keyframes pulse-pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 12px #fecf00); }
    }
    .animate-glow {
      animation: pulse-pop 1.8s ease-in-out infinite;
    }

    /* Dynamic particle and popup keyframe */
    @keyframes score-pop-fade {
      0% { opacity: 0; transform: translateY(10px) scale(0.6); }
      20% { opacity: 1; transform: translateY(-10px) scale(1.2); }
      75% { opacity: 1; transform: translateY(-32px) scale(1); }
      100% { opacity: 0; transform: translateY(-48px) scale(0.85); }
    }
    .score-popup-anim {
      animation: score-pop-fade 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* Gentle swinging foliage */
    @keyframes vine-swing-left {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes vine-swing-right {
      0%, 100% { transform: rotate(4deg); }
      50% { transform: rotate(-4deg); }
    }
    .swing-vine-l {
      transform-origin: top center;
      animation: vine-swing-left 4.5s ease-in-out infinite;
    }
    .swing-vine-r {
      transform-origin: top center;
      animation: vine-swing-right 5.2s ease-in-out infinite;
    }

    /* Game canvas styles */
    #game-canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>

<style>
  #controleSon{
    position:fixed; right:18px; bottom:80px; z-index:9998;
    display:flex; align-items:center; gap:10px;

  #boutonSon{

<script>
  // ═══ AUDIO ENGINE ═══
  const musique   = document.getElementById('musiqueJeu');
  const boutonSon = document.getElementById('boutonSon');
  const volumeJeu = document.getElementById('volumeJeu');
  const controle  = document.getElementById('controleSon');

  let volumeCible = 0.5;
  musique.volume = 0;

  function fonduEntree(){
    musique.volume = 0;
    const fondu = setInterval(() => {
      musique.volume = Math.min(volumeCible, musique.volume + 0.02);
      if (musique.volume >= volumeCible) clearInterval(fondu);
    }, 50);
  }

  function jouerMusique(){
    musique.currentTime = 0;
    musique.play().then(fonduEntree).catch(e => console.log('Lecture bloquée:', e));
    boutonSon.textContent = '🔊';
    controle.classList.add('en-lecture');
  }

  function pauseMusique(){
    musique.pause();
    boutonSon.textContent = '🔇';
    controle.classList.remove('en-lecture');
  }

  // Bouton son
  boutonSon.addEventListener('click', (e) => {
    e.stopPropagation();
    if (musique.paused) {
      musique.play().then(fonduEntree);
      boutonSon.textContent = '🔊';
      controle.classList.add('en-lecture');
    } else {
      musique.pause();
      boutonSon.textContent = '🔇';
      controle.classList.remove('en-lecture');
    }
  });

  volumeJeu.addEventListener('input', () => {
    volumeCible = volumeJeu.value / 100;
    musique.volume = volumeCible;
  });

  // ═══ BRANCHEMENT AU JEU ═══
  // On intercepte les clics sur START et RECOMMENCER
  document.getElementById('btn-start').addEventListener('click', jouerMusique);
  document.getElementById('btn-restart').addEventListener('click', jouerMusique);

  // Hook la fonction gameOver pour mettre en pause
  const originalGameOver = window.gameOver;
  window.gameOver = function(){
    pauseMusique();
    originalGameOver();
  };
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const popupLayer = document.getElementById('popup-layer');

    const hudScore = document.getElementById('hud-score');
    const hudBanana = document.getElementById('hud-banana');
    const hudGauge = document.getElementById('hud-gauge');
    const pauseModal = document.getElementById('pause-modal');
    const modalScore = document.getElementById('modal-score');
    const modalBanana = document.getElementById('modal-banana');

    const btnPause = document.getElementById('btn-pause-trigger');
    const btnResume = document.getElementById('btn-resume');
    const btnRestart = document.getElementById('btn-restart');
    const btnHome = document.getElementById('btn-home');
    const btnQuit = document.getElementById('btn-quit');
    const btnAutorun = document.getElementById('btn-autorun');
    const autorunLabel = document.getElementById('autorun-label');
    const btnJump = document.getElementById('btn-jump');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnSuperRush = document.getElementById('btn-super-rush');
    const btnSound = document.getElementById('btn-sound-toggle');

    // Audio synthesizer context for playful arcade feedback
    let audioCtx = null;
    let soundEnabled = true;

    function playBeep(type = 'coin') {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'coin') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12); // A5
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'jump') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.18);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'rush') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.linearRampToValueAtTime(1040, now + 0.35);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        }
      } catch (e) {}
    }

    // Canvas Resizing
    let width = 0;
    let height = 0;
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Game State
    let isPaused = false;
    let autoRun = true;
    let score = 1840;
    let bananas = 24;
    let gaugeVal = 48;
    let rushAvailable = true;

    // Procedural World Parameters
    let scrollSpeed = 2.4; // Continuous upward or platform downward scroll
    let worldY = 0;
    
    // Player Character Definition
    const player = {
      x: 180,
      y: 350,
      vx: 0,
      vy: 0,
      radius: 28,
      grounded: false,
      currentPlatform: null,
      facing: 1, // 1: right, -1: left
      swingPhase: 0,
      jumpForce: -11.5,
      gravity: 0.42
    };

    // Arrays for procedural elements
    let platforms = [];
    let collectibles = [];
    let particles = [];
    let backgroundVines = [];

    // Helper: Random in range
    const rand = (min, max) => Math.random() * (max - min) + min;

    // Initialize initial procedural landscape
    function initWorld() {
      platforms = [];
      collectibles = [];
      particles = [];
      backgroundVines = [];

      // Ground / Start base platform
      platforms.push({
        x: width * 0.15,
        y: height * 0.65,
        width: width * 0.7,
        height: 18,
        type: 'wood'
      });

      player.x = width * 0.5;
      player.y = height * 0.65 - player.radius;
      player.vx = 0;
      player.vy = 0;

      // Generate staggered platforms up and down
      let currentY = height * 0.65 - 110;
      for (let i = 0; i < 9; i++) {
        spawnPlatform(currentY);
        currentY -= rand(90, 130);
      }

      // Background decorative swinging vines
      for (let i = 0; i < 6; i++) {
        backgroundVines.push({
          x: rand(20, width - 20),
          y: rand(-height, height),
          len: rand(120, 240),
          angle: 0,
          speed: rand(0.015, 0.035)
        });
      }
    }

    function spawnPlatform(yPos) {
      const pWidth = rand(110, 170);
      const minX = 25;
      const maxX = width - pWidth - 25;
      const xPos = rand(minX, Math.max(minX + 10, maxX));

      const plat = {
        x: xPos,
        y: yPos,
        width: pWidth,
        height: 18,
        type: Math.random() > 0.4 ? 'wood' : 'bamboo'
      };
      platforms.push(plat);

      // Procedurally spawn banana or combo star on platform
      if (Math.random() < 0.8) {
        collectibles.push({
          x: xPos + pWidth / 2 + rand(-20, 20),
          y: yPos - 32,
          radius: 14,
          type: Math.random() > 0.25 ? 'banana' : 'combo',
          collected: false,
          floatOffset: Math.random() * Math.PI * 2
        });
      }
    }

    // Popup Text Animation
    function showScorePopup(text, x, y, isSpecial = false) {
      const pop = document.createElement('div');
      pop.className = 'absolute score-popup-anim font-headline-md pointer-events-none flex items-center gap-1 z-30 font-black';
      pop.style.left = `${x}px`;
      pop.style.top = `${y}px`;

      if (isSpecial) {
        pop.innerHTML = `<span class="bg-secondary-container text-surface-container-lowest px-2 py-0.5 rounded-full border border-white text-xs drop-shadow-lg">${text}</span>`;
      } else {
        pop.innerHTML = `<span class="bg-surface-container-lowest/90 text-secondary-fixed border border-secondary-container px-2 py-0.5 rounded-full text-xs drop-shadow">${text}</span>`;
      }
      popupLayer.appendChild(pop);
      setTimeout(() => pop.remove(), 900);
    }

    // Particle Burst on Collect
    function createSparks(x, y, color = '#fecf00') {
      for (let i = 0; i < 9; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5 - 1,
          radius: rand(2.5, 4.5),
          color: color,
          alpha: 1,
          decay: rand(0.02, 0.04)
        });
      }
    }

    // Jumping trigger
    function triggerJump() {
      if (isPaused) return;
      playBeep('jump');
      player.vy = player.jumpForce;
      player.grounded = false;

      // Small hop score
      score += 10;
      hudScore.textContent = score.toLocaleString();
      showScorePopup('+10 JUMP', player.x, player.y - 20);

      // Puff of dust particle
      createSparks(player.x, player.y + player.radius, '#5ede8b');
    }

    function triggerRush() {
      if (isPaused) return;
      playBeep('rush');
      score += 500;
      bananas += 10;
      hudScore.textContent = score.toLocaleString();
      hudBanana.textContent = bananas;
      gaugeVal = Math.min(100, gaugeVal + 30);
      hudGauge.style.width = gaugeVal + '%';

      showScorePopup('+500 RUSH BANANE! ✨', player.x - 30, player.y - 45, true);
      createSparks(player.x, player.y, '#5ede8b');
      createSparks(player.x, player.y, '#fecf00');

      // Super jump boost
      player.vy = -14;
      player.grounded = false;
    }

    // Input handlers
    btnJump.addEventListener('click', triggerJump);
    btnSuperRush.addEventListener('click', triggerRush);

    // Directional buttons
    let moveLeft = false;
    let moveRight = false;
    
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; player.facing = -1; }, { passive: false });
    btnLeft.addEventListener('touchend', () => { moveLeft = false; });
    btnLeft.addEventListener('mousedown', () => { moveLeft = true; player.facing = -1; });
    btnLeft.addEventListener('mouseup', () => { moveLeft = false; });

    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; player.facing = 1; }, { passive: false });
    btnRight.addEventListener('touchend', () => { moveRight = false; });
    btnRight.addEventListener('mousedown', () => { moveRight = true; player.facing = 1; });
    btnRight.addEventListener('mouseup', () => { moveRight = false; });

    // Keyboard support (Space, Arrows)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        triggerJump();
      } else if (e.code === 'ArrowLeft') {
        moveLeft = true;
        player.facing = -1;
      } else if (e.code === 'ArrowRight') {
        moveRight = true;
        player.facing = 1;
      } else if (e.code === 'KeyP') {
        togglePause();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft') moveLeft = false;
      if (e.code === 'ArrowRight') moveRight = false;
    });

    // Canvas Direct Tap to Jump
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX < width * 0.35) {
        player.vx = -4.5;
        player.facing = -1;
      } else if (clickX > width * 0.65) {
        player.vx = 4.5;
        player.facing = 1;
      }
      triggerJump();
    });

    // Auto-Run Button Toggle
    btnAutorun.addEventListener('click', () => {
      autoRun = !autoRun;
      if (autoRun) {
        autorunLabel.textContent = 'AUTO: ON';
        autorunLabel.classList.replace('text-on-surface-variant', 'text-primary');
      } else {
        autorunLabel.textContent = 'AUTO: OFF';
        autorunLabel.classList.replace('text-primary', 'text-on-surface-variant');
      }
    });

    // Pause Modals
    function togglePause() {
      isPaused = !isPaused;
      if (isPaused) {
        pauseModal.classList.remove('hidden');
        modalScore.textContent = score.toLocaleString() + ' pts';
        modalBanana.textContent = bananas;
      } else {
        pauseModal.classList.add('hidden');
      }
    }

    btnPause.addEventListener('click', togglePause);
    btnResume.addEventListener('click', togglePause);
    btnHome.addEventListener('click', togglePause);
    btnQuit.addEventListener('click', togglePause);

    btnRestart.addEventListener('click', () => {
      score = 0;
      bananas = 0;
      gaugeVal = 20;
      hudScore.textContent = score;
      hudBanana.textContent = bananas;
      hudGauge.style.width = '20%';
      initWorld();
      togglePause();
    });

    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      const icon = btnSound.querySelector('.material-symbols-outlined');
      const text = btnSound.querySelector('span:not(.material-symbols-outlined)');
      if (soundEnabled) {
        icon.textContent = 'volume_up';
        text.textContent = 'Son : ON';
      } else {
        icon.textContent = 'volume_off';
        text.textContent = 'Son : OFF';
      }
    });

    // Main Procedural Game Loop
    initWorld();
    let lastTime = performance.now();

    function gameLoop(now) {
      requestAnimationFrame(gameLoop);
      if (isPaused) return;

      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // Update Procedural Scroll
      worldY += scrollSpeed;

      // Horizontal player input & movement
      if (moveLeft) player.vx = -4.5;
      else if (moveRight) player.vx = 4.5;
      else player.vx *= 0.88;

      // Auto-jump logic when Auto-run is ON and monkey lands or needs forward momentum
      if (autoRun) {
        if (player.grounded) {
          triggerJump();
          // Gentle autonomous steering towards nearest banana or center
          const targetItem = collectibles.find(c => !c.collected && c.y < player.y && c.y > player.y - 180);
          if (targetItem) {
            player.vx = (targetItem.x - player.x) * 0.04;
            player.facing = player.vx >= 0 ? 1 : -1;
          } else {
            // Keep towards middle track
            player.vx = (width / 2 - player.x) * 0.02;
          }
        }
      }

      player.x += player.vx;
      // Boundaries
      if (player.x < player.radius) player.x = player.radius;
      if (player.x > width - player.radius) player.x = width - player.radius;

      // Gravity and Vertical Physics
      player.vy += player.gravity;
      player.y += player.vy;

      // Continuous downward world progression relative to player
      // Move all platforms & collectibles downwards
      const effectiveScroll = scrollSpeed + (player.y < height * 0.4 ? (height * 0.4 - player.y) * 0.05 : 0);
      player.y += effectiveScroll * 0.35;

      for (let p of platforms) {
        p.y += effectiveScroll;
      }
      for (let c of collectibles) {
        c.y += effectiveScroll;
      }
      for (let v of backgroundVines) {
        v.y += effectiveScroll * 0.4;
        if (v.y > height + 100) v.y = -180;
      }

      // Check landing on platforms (falling down)
      player.grounded = false;
      if (player.vy >= 0) {
        for (let p of platforms) {
          if (
            player.x + player.radius * 0.5 > p.x &&
            player.x - player.radius * 0.5 < p.x + p.width &&
            player.y + player.radius >= p.y &&
            player.y + player.radius <= p.y + p.height + player.vy
          ) {
            player.y = p.y - player.radius;
            player.vy = 0;
            player.grounded = true;
            break;
          }
        }
      }

      // If fallen below viewport, rescue back up (infinite runner mechanic)
      if (player.y > height + 60) {
        player.y = -30;
        player.vy = 2;
        player.x = width / 2;
        score = Math.max(0, score - 50);
        hudScore.textContent = score.toLocaleString();
        showScorePopup('-50 OUPS!', player.x - 20, 100);
      }

      // Spawn new platforms procedurally at the top as old ones leave the bottom
      platforms = platforms.filter(p => p.y < height + 80);
      collectibles = collectibles.filter(c => c.y < height + 80 && !c.collected);

      // Check highest platform
      let highestY = Math.min(...platforms.map(p => p.y), height);
      if (highestY > -40) {
        spawnPlatform(highestY - rand(100, 135));
      }

      // Banana & Item Collection Collision
      collectibles.forEach(item => {
        if (item.collected) return;
        const dist = Math.hypot(player.x - item.x, player.y - item.y);
        if (dist < player.radius + item.radius + 6) {
          item.collected = true;
          playBeep('coin');
          if (item.type === 'banana') {
            bananas += 1;
            score += 50;
            showScorePopup('+50 🍌', item.x - 20, item.y);
            createSparks(item.x, item.y, '#fecf00');
          } else {
            bananas += 2;
            score += 150;
            showScorePopup('COMBO x2! +150 ✨', item.x - 35, item.y, true);
            createSparks(item.x, item.y, '#5ede8b');
          }
          hudScore.textContent = score.toLocaleString();
          hudBanana.textContent = bananas;

          // Increment gauge
          gaugeVal = Math.min(100, gaugeVal + 3);
          hudGauge.style.width = gaugeVal + '%';
        }
      });

      // Update particles
      particles.forEach(pt => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= pt.decay;
      });
      particles = particles.filter(pt => pt.alpha > 0);

      // Continuous subtle score increment for infinite distance
      if (Math.random() < 0.25) {
        score += 1;
        hudScore.textContent = score.toLocaleString();
      }

      // RENDERING
      ctx.clearRect(0, 0, width, height);

      // Draw background hanging vines
      ctx.strokeStyle = '#05a357';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      backgroundVines.forEach(v => {
        v.angle += v.speed;
        const swingX = Math.sin(v.angle) * 16;
        ctx.beginPath();
        ctx.moveTo(v.x, v.y);
        ctx.quadraticCurveTo(v.x + swingX, v.y + v.len / 2, v.x + swingX * 1.5, v.y + v.len);
        ctx.stroke();

        // Vine leaves
        ctx.fillStyle = '#10a65a';
        ctx.beginPath();
        ctx.arc(v.x + swingX * 1.2, v.y + v.len * 0.7, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Platforms
      platforms.forEach(p => {
        // Platform shadow
        ctx.fillStyle = 'rgba(15, 8, 3, 0.45)';
        ctx.beginPath();
        ctx.roundRect(p.x, p.y + 6, p.width, p.height, 9);
        ctx.fill();

        // Platform base
        const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.height);
        if (p.type === 'bamboo') {
          grad.addColorStop(0, '#513123');
          grad.addColorStop(1, '#33180c');
        } else {
          grad.addColorStop(0, '#4c2d1f');
          grad.addColorStop(1, '#250c03');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.width, p.height, 8);
        ctx.fill();

        // Platform border highlight
        ctx.strokeStyle = '#753400';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Top moss / vine highlight
        ctx.fillStyle = '#5ede8b';
        ctx.beginPath();
        ctx.roundRect(p.x + 4, p.y + 1, p.width - 8, 3, 2);
        ctx.fill();

        // Wood plank notches
        ctx.fillStyle = '#1e0801';
        for (let nx = p.x + 20; nx < p.x + p.width - 15; nx += 35) {
          ctx.fillRect(nx, p.y + 4, 3, p.height - 8);
        }
      });

      // Draw Collectibles (Bananas & Combo Stars)
      const timeSec = now * 0.004;
      collectibles.forEach(c => {
        if (c.collected) return;
        const bobY = Math.sin(timeSec + c.floatOffset) * 6;
        const cy = c.y + bobY;

        // Glowing circle
        ctx.save();
        ctx.beginPath();
        ctx.arc(c.x, cy, c.radius + 6, 0, Math.PI * 2);
        ctx.fillStyle = c.type === 'combo' ? 'rgba(94, 222, 139, 0.25)' : 'rgba(254, 207, 0, 0.25)';
        ctx.fill();

        // Outline ring
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = c.type === 'combo' ? '#5ede8b' : '#fecf00';
        ctx.stroke();

        // Item emoji
        ctx.font = '18px Rubik, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(c.type === 'combo' ? '🍌✨' : '🍌', c.x, cy);
        ctx.restore();
      });

      // Draw Sparks Particles
      particles.forEach(pt => {
        ctx.save();
        ctx.globalAlpha = pt.alpha;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Draw Cute Animated WikiMonkey Character
      drawMonkey(player.x, player.y, player.facing, player.grounded, now);
    }

    // Render Procedural Vector Monkey Mascot
    function drawMonkey(x, y, facing, grounded, time) {
      ctx.save();
      ctx.translate(x, y);
      if (facing < 0) {
        ctx.scale(-1, 1);
      }

      // Small bounce scale
      const breath = Math.sin(time * 0.008) * 1.5;

      // Shadow below character when near platform
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 26, 20, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Tail
      ctx.strokeStyle = '#6b3819';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-12, 10);
      const tailWiggle = Math.sin(time * 0.01) * 8;
      ctx.quadraticCurveTo(-26, 4 + tailWiggle, -28, -8 + tailWiggle);
      ctx.stroke();

      // Ears
      // Outer ears
      ctx.fillStyle = '#6b3819';
      ctx.beginPath();
      ctx.arc(-19, -4, 9, 0, Math.PI * 2);
      ctx.arc(19, -4, 9, 0, Math.PI * 2);
      ctx.fill();
      // Inner ears
      ctx.fillStyle = '#ffdbc8';
      ctx.beginPath();
      ctx.arc(-19, -4, 4.5, 0, Math.PI * 2);
      ctx.arc(19, -4, 4.5, 0, Math.PI * 2);
      ctx.fill();

      // Head / Body circle
      ctx.fillStyle = '#6b3819';
      ctx.beginPath();
      ctx.arc(0, 0, 22 + breath * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#1e0801';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Face Mask (Tan peach heart/round shape)
      ctx.fillStyle = '#ffdbc8';
      ctx.beginPath();
      ctx.ellipse(0, 3, 16, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cheerful Eyes
      ctx.fillStyle = '#1e0801';
      ctx.beginPath();
      ctx.ellipse(-6, -1, 3.5, 5, 0, 0, Math.PI * 2);
      ctx.ellipse(6, -1, 3.5, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye catchlights
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-5, -3, 1.4, 0, Math.PI * 2);
      ctx.arc(7, -3, 1.4, 0, Math.PI * 2);
      ctx.fill();

      // Cute Snout & Smile
      ctx.fillStyle = '#f1ad88';
      ctx.beginPath();
      ctx.ellipse(0, 8, 8, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Smile curve
      ctx.strokeStyle = '#1e0801';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, 7.5, 4, 0.2, Math.PI - 0.2);
      ctx.stroke();

      // Hand holding Banana
      ctx.save();
      ctx.translate(14, 10);
      ctx.rotate(0.3 + Math.sin(time * 0.01) * 0.2);
      ctx.font = '16px Rubik, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🍌', 0, 0);
      ctx.restore();

      ctx.restore();
    }

    // Start loop
    requestAnimationFrame(gameLoop);
  });
</script>
